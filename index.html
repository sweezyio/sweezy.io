<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Blake Sweezy — production manager and lighting designer. Get in touch to talk about your next production.">
    <title>Blake Sweezy — Production &amp; Lighting</title>
    <link rel="stylesheet" href="https://unpkg.com/tachyons@4.12.0/css/tachyons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400&amp;family=Tiro+Telugu:ital@1&amp;display=swap">
    <style>
        body { font-family: 'Spline Sans', sans-serif; }
        #name {
            font-family: 'Tiro Telugu', Georgia, serif;
            font-size: clamp(2.5rem, 5vw, 3.75rem);
        }

        /* The artwork alone needs custom positioning and a fade beneath the copy. */
        .source-four-background {
            position: absolute;
            left: -12%;
            top: 50%;
            width: 78%;
            height: auto;
            transform: translateY(-50%);
            filter: invert(1);
            opacity: .3;
            mask-image: linear-gradient(to right, #000 25%, transparent 95%);
            -webkit-mask-image: linear-gradient(to right, #000 25%, transparent 95%);
            pointer-events: none;
        }
        @media screen and (max-width: 60em) {
            /* Keep the whole fixture in view and fade it below the introduction. */
            .source-four-background {
                left: 50%;
                top: 1rem;
                width: 100%;
                max-width: 28rem;
                transform: translateX(-50%);
                opacity: .2;
                mask-image: linear-gradient(to bottom, #000 30%, transparent 100%);
                -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent 100%);
            }
        }
    </style>
</head>
<body class="ma0 bg-black light-gray">
    <main class="min-vh-100 flex items-center pa4 pa5-ns">
        <article class="relative w-100 mw8 center pv4 pv5-ns" aria-labelledby="name">
            <!-- Original Source Four 36° illustration from ETC's technical datasheet:
                 https://www.etcconnect.com/workarea/DownloadAsset.aspx?id=10737460423 -->
            <img class="source-four-background" src="./img/source-four.svg" width="176" height="156" alt="" aria-hidden="true">
            <div class="relative z-1 flex justify-end-l">
                <div class="w-100 w-60-l pl4-l">
                    <img class="db w4 h4 mb4 br-100 ba b--white-30" src="./img/headshot.jpg" width="128" height="128" alt="Blake Sweezy">
                    <h1 id="name" class="i fw4 near-white mt0 mb3">Blake Sweezy</h1>
                    <p class="f5 f4-ns fw4 lh-copy mt0 mb4">
                        Production management<br>
                        <span class="silver">&amp; lighting design</span>
                    </p>
                    <p class="f5 lh-copy silver measure mt0 mb4">
                        I bring people, planning, and light together to make live productions happen.
                        From the first conversation to the final cue, I care about the details that make a show work.
                    </p>
                    <nav class="flex flex-column items-start" aria-label="Contact">
                        <a class="dib light-gray hover-white underline f5 pv3" href="mailto:contact@blake.lighting">contact@blake.lighting</a>
                        <a class="dib light-gray hover-white underline f5 pv3" href="https://www.linkedin.com/in/sweezy">LinkedIn <span aria-hidden="true">↗</span></a>
                    </nav>
                </div>
            </div>
        </article>
    </main>
</body>
</html>
